server:
  servlet:
    context-path: ${API_PATH}
  error:
    include-stacktrace: never
    include-message: never
  port: ${PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      minimum-idle: ${HIKARI_MIN_IDLE}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${localhost}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}

  flyway:
    locations: ${FLYWAY_LOCATIONS}
    encoding: UTF-8
    baseline-on-migrate: false


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_FOLDER:finance}
  max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:10485760}


payos:
  enabled: ${PAYOS_ENABLED:true}
  client-id: ${PAYOS_CLIENT_ID}
  api-key: ${PAYOS_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY}
  base-url: ${PAYOS_BASE_URL}
  return-url: ${PAYOS_RETURN_URL}
  cancel-url: ${PAYOS_CANCEL_URL}
  expired-minutes: ${PAYOS_EXPIRED_MINUTES:15}
  webhook-log:
    retention-days: ${PAYMENT_WEBHOOK_LOG_RETENTION_DAYS:30}
    missing-minutes: ${PAYMENT_WEBHOOK_MISSING_MINUTES:10}

premium:
  prices:
    one-month: ${PREMIUM_PRICE_1M}
    six-months: ${PREMIUM_PRICE_6M}
    twelve-months: ${PREMIUM_PRICE_12M}

payment:
  topup:
    seconds: ${PAYMENT_TOPUP_SECONDS}
    reminder-seconds: ${PAYMENT_TOPUP_REMINDER_SECONDS}
    job-seconds: ${PAYMENT_TOPUP_JOB_SECONDS}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 3600

logging:
  level:
    root: INFO
    com.datn.financeapp: INFO
    org.springframework.web: WARN
    org.hibernate: WARN

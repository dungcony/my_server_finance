spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance?reWriteBatchedInserts=true
    username: postgres
    password: 123456
    hikari:
      maximum-pool-size: 65
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        ddl-auto: validate
        jdbc:
          batch_size: 50
        order_inserts: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    locations: classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false

# ngưỡng cảnh báo của ServicePerformanceAspect (chỉ chạy ở profile dev)
app:
  perf:
    sql-warn-threshold: 1000
    slow-ms: 1000

logging:
  level:
    com.zaxxer.hikari.pool.HikariPool: warn
    com.datn.financeapp: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.transaction: warn
  file:
    name: target/server.log

server:
  #  compression:
  #    enabled: true
  #    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
  #    min-response-size: 1024
  port: 8080
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 10MB
    max-connections: 8192 # Số lượng kết nối TCP tối đa Tomcat chấp nhận cùng lúc (mặc định: 8192)
    accept-count: 300 # Hàng đợi cấp OS khi max-connections bị đầy (mặc định: 100)
    connection-timeout: 20000ms # Thời gian chờ client gửi dữ liệu trước khi đóng socket (20s)
    keep-alive-timeout: 15000ms # Thời gian giữ kết nối TCP cho reuse
    threads:
      max: 500 # Số thread tối đa xử lý request đồng thời (mặc định: 200)
      min-spare: 50 # Số thread tối thiểu luôn giữ sẵn (mặc định: 10)


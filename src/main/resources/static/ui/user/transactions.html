<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ giao dịch cá nhân - Finance AI</title>
    <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body data-area="user" data-active="transactions" data-title="Sổ Giao dịch">
<main id="page">
    <div class="grid grid-4" id="statsGrid">
        <div class="stat">
            <div class="label">Tổng thu nhập</div>
            <div class="value pos" id="sIncome">0 đ</div>
            <div class="sub" id="sIncomeSub">kỳ hiển thị</div>
        </div>
        <div class="stat">
            <div class="label">Tổng chi tiêu</div>
            <div class="value neg" id="sExpense">0 đ</div>
            <div class="sub" id="sExpenseSub">kỳ hiển thị</div>
        </div>
        <div class="stat">
            <div class="label">Thu chi ròng</div>
            <div class="value" id="sNet">0 đ</div>
            <div class="sub">thu nhập - chi tiêu</div>
        </div>
        <div class="stat">
            <div class="label">Số giao dịch</div>
            <div class="value" id="sCount">0</div>
            <div class="sub" id="sPageSub">trang 1</div>
        </div>
    </div>

    <div class="card mt">
        <div class="card-title">
            <span>Bộ lọc giao dịch</span>
            <div class="btn-row">
                <button class="btn btn-secondary btn-sm" id="btnResetFilters">↺ Đặt lại bộ lọc</button>
                <button class="btn btn-sm" id="btnCreateTxn">+ Thêm giao dịch mới</button>
            </div>
        </div>
        <div class="grid grid-4" style="gap:10px;margin-top:6px">
            <div class="form-group" style="margin-bottom:0">
                <label for="fWallet">Ví thanh toán</label>
                <select id="fWallet">
                    <option value="">-- Tất cả ví --</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="fType">Loại giao dịch</label>
                <select id="fType">
                    <option value="">-- Tất cả loại --</option>
                    <option value="EXPENSE">Chi tiêu (EXPENSE)</option>
                    <option value="INCOME">Thu nhập (INCOME)</option>
                    <option value="LOAN">Khoản vay (LOAN)</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="fPeriod">Khoảng thời gian</label>
                <select id="fPeriod">
                    <option value="">Tùy chỉnh ngày</option>
                    <option value="week">Tuần này</option>
                    <option value="month" selected>Tháng này</option>
                    <option value="quarter">Quý này</option>
                    <option value="year">Năm này</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="fSearch">Tìm kiếm từ khóa</label>
                <input type="text" id="fSearch" placeholder="Tên, nội dung...">
            </div>
        </div>
        <div class="grid grid-4" style="gap:10px;margin-top:8px">
            <div class="form-group" style="margin-bottom:0">
                <label for="fFrom">Từ ngày</label>
                <input type="date" id="fFrom">
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="fTo">Đến ngày</label>
                <input type="date" id="fTo">
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label for="fMinAmount">Số tiền tối thiểu</label>
                <input type="number" id="fMinAmount" placeholder="VD: 50000" min="0">
            </div>
            <div class="form-group" style="margin-bottom:0;display:flex;align-items:flex-end;gap:8px">
                <div style="flex:1">
                    <label for="fMaxAmount">Số tiền tối đa</label>
                    <input type="number" id="fMaxAmount" placeholder="VD: 10000000" min="0">
                </div>
                <button class="btn btn-secondary" id="btnFilter" style="height:36px;margin-bottom:1px">🔍 Lọc</button>
            </div>
        </div>
    </div>

    <div class="card mt">
        <div class="card-title">
            <span>Danh sách giao dịch <span class="muted" id="totalItemsText"></span></span>
            <div class="btn-row">
                <button class="btn btn-secondary btn-sm" id="btnReloadTable">🔄 Tải lại</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width:140px">Thời gian</th>
                        <th style="width:100px">Phân loại</th>
                        <th>Tên giao dịch</th>
                        <th>Danh mục</th>
                        <th>Ví thanh toán</th>
                        <th class="right" style="width:140px">Số tiền</th>
                        <th class="center" style="width:150px">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="txnTableBody">
                    <tr><td colspan="7" class="center muted">Đang tải dữ liệu giao dịch...</td></tr>
                </tbody>
            </table>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border)">
            <span class="muted" id="paginationInfo">Trang 1</span>
            <div class="btn-row">
                <button class="btn btn-secondary btn-sm" id="btnPrevPage">◀ Trước</button>
                <button class="btn btn-secondary btn-sm" id="btnNextPage">Sau ▶</button>
            </div>
        </div>
    </div>
</main>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="./js/transactions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví - Finance AI</title>
    <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body data-area="user" data-active="wallets" data-title="Ví">
<main id="page">
    <div class="grid grid-3" id="summaryCards"></div>

    <div class="card mt">
        <div class="card-title">
            <span>Danh sách ví <span class="muted" id="count"></span></span>
            <div class="btn-row">
                <select id="fType" style="width:auto">
                    <option value="">Mọi loại</option>
                    <option value="cash">Tiền mặt</option>
                    <option value="bank">Ngân hàng</option>
                    <option value="e_wallet">Ví điện tử</option>
                    <option value="credit_card">Thẻ tín dụng</option>
                </select>
                <label class="check" style="margin:0"><input type="checkbox" id="fOnlyTotal"> Chỉ ví tính vào tổng</label>
                <label class="check" style="margin:0"><input type="checkbox" id="fShared" checked> Gồm ví chung</label>
                <button class="btn btn-secondary" id="btnReload">↻</button>
                <button class="btn" id="btnCreate">+ Tạo ví</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>Tên</th><th>Loại</th><th class="right">Số dư</th><th>Tính vào tổng</th><th>Nhóm</th><th></th></tr></thead>
                <tbody id="walletBody"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="./js/wallets.js"></script>
</body>
</html>

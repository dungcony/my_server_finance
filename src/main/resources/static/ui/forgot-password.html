<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Finance AI</title>
    <link rel="stylesheet" href="./assets/css/base.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Quên mật khẩu</h1>
        <div class="sub">Nhận mã đặt lại qua email rồi đặt mật khẩu mới</div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <button class="btn btn-secondary" id="btnSend">Gửi mã đặt lại</button>

        <div id="stepReset" class="hidden mt">
            <div class="form-group">
                <label for="code">Mã đặt lại</label>
                <input type="text" id="code">
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới (tối thiểu 8 ký tự)</label>
                <input type="password" id="newPassword" autocomplete="new-password">
            </div>
            <button class="btn" id="btnReset">Đặt lại mật khẩu</button>
        </div>

        <div class="auth-links"><a href="./login.html">← Về đăng nhập</a></div>
    </div>
</div>

<script src="./assets/js/api.js"></script>
<script src="./assets/js/ui.js"></script>
<script>
    $('btnSend').onclick = async () => {
        const email = $('email').value.trim();
        if (!email) return toast('Vui lòng nhập email', 'error');
        const res = await api('/auth/forgot-password', { method: 'POST', body: { email } });
        if (toastResult(res, 'Nếu email tồn tại, mã đặt lại đã được gửi')) $('stepReset').classList.remove('hidden');
    };

    $('btnReset').onclick = async () => {
        const body = { email: $('email').value.trim(), reset_code: $('code').value.trim(), new_password: $('newPassword').value };
        if (!body.reset_code || body.new_password.length < 8) return toast('Nhập mã và mật khẩu mới tối thiểu 8 ký tự', 'error');
        const res = await api('/auth/reset-password', { method: 'POST', body });
        if (toastResult(res, 'Đã đặt lại mật khẩu')) setTimeout(() => location.href = UI_ROOT + 'login.html', 1200);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám sát Giao dịch Quỹ Nhóm - Finance AI Admin</title>
    <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body data-area="admin" data-active="group-transactions" data-title="Giám sát Giao dịch Quỹ Toàn Hệ thống">
<main id="page">
    <div class="card">
        <div class="card-title">
            <span>Sổ theo dõi giao dịch quỹ nhóm toàn hệ thống</span>
            <div class="btn-row">
                <select id="fTxnGroup" style="width:200px">
                    <option value="">Tất cả các nhóm</option>
                </select>
                <select id="fTxnType" style="width:auto">
                    <option value="">Mọi loại</option>
                    <option>EXPENSE</option>
                    <option>CONTRIBUTION</option>
                    <option>REFUND</option>
                    <option>ADJUSTMENT_UP</option>
                    <option>ADJUSTMENT_DOWN</option>
                </select>
                <select id="fTxnStatus" style="width:auto">
                    <option value="">Mọi trạng thái</option>
                    <option>PENDING</option>
                    <option>CONFIRMED</option>
                    <option>REJECTED</option>
                </select>
                <button class="btn btn-secondary" id="btnReloadAdminTxn">🔄 Làm mới</button>
            </div>
        </div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nhóm</th>
                        <th>Loại giao dịch</th>
                        <th>Nguồn tiền</th>
                        <th class="right">Số tiền</th>
                        <th>Trạng thái</th>
                        <th>Ghi chú</th>
                        <th>Thời gian</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="adminTxnBody"></tbody>
            </table>
        </div>
    </div>
</main>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
let allAdminTxns = [];
let allAdminGroups = [];

async function initAdminTxns() {
    const res = await api('/groups');
    allAdminGroups = dataOf(res) || [];

    $('fTxnGroup').innerHTML = '<option value="">Tất cả các nhóm (' + allAdminGroups.length + ')</option>' +
        allAdminGroups.map(g => `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');

    await loadAdminTransactions();
}

async function loadAdminTransactions() {
    allAdminTxns = [];
    const groupSelect = $('fTxnGroup').value;
    const targetGroups = groupSelect ? allAdminGroups.filter(g => g.id === groupSelect) : allAdminGroups.slice(0, 5);

    for (const g of targetGroups) {
        const res = await api(`/groups/${g.id}/transactions/all`, { query: { size: 15 }, silent: true });
        const data = dataOf(res) || {};
        const items = data.items || data.content || data.transactions || [];
        items.forEach(t => {
            t.groupName = g.name;
            t.groupId = g.id;
            allAdminTxns.push(t);
        });
    }

    renderAdminTxns();
}

function renderAdminTxns() {
    const type = $('fTxnType').value;
    const st = $('fTxnStatus').value;

    const filtered = allAdminTxns.filter(t => {
        if (type && t.type !== type) return false;
        if (st && t.status !== st) return false;
        return true;
    });

    setTable($('adminTxnBody'), filtered.map(t => `
        <tr>
            <td>
                <a href="../manager/group-detail.html?id=${esc(t.groupId)}"><b>${esc(t.groupName || shortId(t.groupId))}</b></a>
            </td>
            <td>${badge(t.type)}</td>
            <td>${badge(t.money_source, 'info')}</td>
            <td class="right"><b>${fmtMoney(t.amount)}</b></td>
            <td>${badge(t.status)}</td>
            <td>${esc(t.note || '-')}</td>
            <td class="nowrap">${fmtDate(t.occurred_at || t.created_at)}</td>
            <td>
                <a class="btn btn-secondary btn-sm" href="../manager/group-detail.html?id=${esc(t.groupId)}">Vào nhóm →</a>
            </td>
        </tr>
    `).join(''), 8, 'Không có giao dịch nào phù hợp');
}

$('fTxnGroup').onchange = loadAdminTransactions;
$('fTxnType').onchange = renderAdminTxns;
$('fTxnStatus').onchange = renderAdminTxns;
$('btnReloadAdminTxn').onclick = loadAdminTransactions;

initAdminTxns();
</script>
</body>
</html>

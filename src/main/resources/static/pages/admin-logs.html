<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance AI - Realtime Admin Console Logs</title>
    <link rel="stylesheet" href="../css/admin-logs.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <span>⚡ Finance AI · Log hệ thống</span>
            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">Chưa kết nối</span>
            </div>
        </div>

        <div class="controls-group">
            <span id="userInfo" style="color: var(--text-muted); font-size: 12px;">Chưa đăng nhập</span>
            <button id="btnPause" onclick="togglePause()">⏸️ Tạm dừng</button>
            <button onclick="clearLogs()">🗑️ Xóa màn hình</button>
            <button id="btnAuth" onclick="openAuthModal()">🔑 Đăng nhập Admin</button>
            <button id="btnDisconnect" class="btn-danger" style="display: none;" onclick="disconnectStream()">Ngắt kết nối</button>
        </div>
    </header>

    <!-- 5-Minute Metric Strip -->
    <div class="metric-strip">
        <span class="metric-label">⏱️ 5 phút qua:</span>
        <button class="metric-chip chip-error" onclick="applyMetricFilter('ERROR')" title="Bấm để lọc các dòng ERROR">ERROR <strong id="mError">0</strong></button>
        <button class="metric-chip chip-warn" onclick="applyMetricFilter('WARN')" title="Bấm để lọc các dòng WARN">WARN <strong id="mWarn">0</strong></button>
        <button class="metric-chip chip-4xx" onclick="applyMetricFilter('4xx')" title="Bấm để lọc các request lỗi 4xx">4xx <strong id="m4xx">0</strong></button>
        <button class="metric-chip chip-5xx" onclick="applyMetricFilter('5xx')" title="Bấm để lọc các request lỗi 5xx">5xx <strong id="m5xx">0</strong></button>
        <span class="metric-chip chip-p95" title="Bách phân vị 95 độ trễ HTTP request trong 5 phút gần nhất (ước lượng từ HTTP log)">p95 <strong id="mP95">0ms</strong></span>
        <button class="metric-chip chip-total" onclick="applyMetricFilter('ALL')" title="Bấm để hiển thị tất cả log">Tất cả: <strong id="mTotal">0</strong> dòng</button>
        <span class="metric-note">*ước lượng</span>
    </div>

    <!-- Controls Toolbar -->
    <div class="controls">
        <div class="controls-group">
            <label for="levelFilter">Mức:</label>
            <select id="levelFilter" onchange="renderLogs()">
                <option value="ALL">ALL</option>
                <option value="INFO">INFO</option>
                <option value="WARN">WARN</option>
                <option value="ERROR">ERROR</option>
                <option value="DEBUG">DEBUG</option>
            </select>

            <label for="sourceFilter">Nguồn:</label>
            <select id="sourceFilter" onchange="renderLogs()">
                <option value="ALL">Tất cả nguồn</option>
                <option value="HTTP">🌐 HTTP</option>
                <option value="Security">🛡️ Security</option>
                <option value="Auth">🔑 Auth</option>
                <option value="Database">🗄️ Database</option>
                <option value="App">⚙️ App</option>
            </select>

            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 Tìm path / reqId / user / message..." oninput="renderLogs()">
                <button id="btnClearSearch" class="btn-clear-search" onclick="clearSearch()" style="display: none;" title="Xóa tìm kiếm">✕</button>
            </div>

            <label class="checkbox-label" title="Ẩn các request file tĩnh và log nội bộ static mapping">
                <input type="checkbox" id="chkHideStatic" checked onchange="renderLogs()"> Ẩn tĩnh
            </label>
        </div>

        <div class="controls-group">
            <span id="activeFilterBadge" class="active-filter-badge" style="display: none;">
                Đang lọc: <strong id="activeFilterText"></strong>
                <button class="btn-remove-filter" onclick="resetAllFilters(event)" title="Hủy lọc">✕</button>
            </span>
        </div>
    </div>

    <!-- Terminal Logs Table Container with Smart Scroll Button -->
    <div id="logTableWrapper" class="log-table-wrapper">
        <table class="log-table" id="logTable">
            <thead>
                <tr>
                    <th class="th-expand" aria-label="Mở rộng"></th>
                    <th class="th-req">reqId</th>
                    <th class="th-type">type</th>
                    <th class="th-source">source</th>
                    <th class="th-api">api</th>
                    <th class="th-user">user</th>
                    <th class="th-meslog">meslog</th>
                    <th class="th-status">status</th>
                    <th class="th-time">time</th>
                </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
        </table>

        <button id="smartScrollBtn" class="smart-scroll-btn" onclick="scrollDownToBottom()" style="display: none;">
            ↓ <span id="newLogsCount">0</span> dòng mới
        </button>
    </div>

    <!-- Modal Login -->
    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-title">🔐 Xác thực Quản trị viên</div>
            <div id="authError" style="display: none; color: #ff5252; font-size: 12px; margin-bottom: 12px; background: rgba(255,82,82,0.1); border: 1px solid rgba(255,82,82,0.25); padding: 8px 10px; border-radius: 6px; word-break: break-word;"></div>
            <div class="form-group">
                <label>Email Admin</label>
                <input type="text" id="adminEmail" value="admin@financeapp.com">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="adminPassword" value="Admin@123">
            </div>
            <div style="margin: 10px 0; text-align: center; color: var(--text-muted); font-size: 11px;">— HOẶC DÁN TOKEN JWT —</div>
            <div class="form-group">
                <label>Bearer Token</label>
                <input type="text" id="rawToken" placeholder="eyJhbGciOiJIUzI1Ni...">
            </div>
            <div class="modal-actions">
                <button onclick="closeAuthModal()">Hủy</button>
                <button class="btn-primary" onclick="handleLogin()">Đăng nhập & Kết nối</button>
            </div>
        </div>
    </div>

    <script src="../js/admin-logs.js"></script>
</body>
</html>

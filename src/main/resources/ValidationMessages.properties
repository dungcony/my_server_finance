# Message mặc định của Jakarta Bean Validation, bằng tiếng Việt.
#
# Hibernate Validator đọc THẲNG file tên `ValidationMessages.properties` ở classpath root và tự
# nội suy {min}/{max}/{value}. Không đi qua Spring MessageSource — bản Spring xử lý placeholder
# theo cú pháp MessageFormat nên nuốt mất tham số, in ra "từ min đến max".
#
# api/00-QUY-UOC-CHUNG.md mục 4.4: trường `message` hiển thị THẲNG cho người dùng.
jakarta.validation.constraints.NotNull.message=Trường này là bắt buộc.
jakarta.validation.constraints.NotBlank.message=Trường này không được để trống.
jakarta.validation.constraints.NotEmpty.message=Trường này không được để trống.
jakarta.validation.constraints.Email.message=Email không đúng định dạng.
jakarta.validation.constraints.Size.message=Độ dài phải từ {min} đến {max} ký tự.
jakarta.validation.constraints.Positive.message=Giá trị phải lớn hơn 0.
jakarta.validation.constraints.PositiveOrZero.message=Giá trị không được âm.
jakarta.validation.constraints.Min.message=Giá trị tối thiểu là {value}.
jakarta.validation.constraints.Max.message=Giá trị tối đa là {value}.
jakarta.validation.constraints.Pattern.message=Giá trị không đúng định dạng.

server:
  servlet:
    context-path: /v1

spring:
  application:
    name: financeapp
  jackson:
    # api/00-QUY-UOC-CHUNG.md: mọi trường JSON dùng snake_case. DTO Java giữ camelCase chuẩn
    # convention ngôn ngữ (CLAUDE.md gốc), Jackson tự chuyển đổi 2 chiều qua naming-strategy —
    # không cần @JsonProperty thủ công trên từng field của mọi DTO hiện tại lẫn tương lai.
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: filesystem:../../db/migration
    encoding: UTF-8
    baseline-on-migrate: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 3600
  refresh-token-expiry-days: 30

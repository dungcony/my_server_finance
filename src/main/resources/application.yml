server:
  servlet:
    context-path: ${API_PATH:}

spring:
  profiles:
    active: ${PROFILES_ACTIVE:}
  application:
    name: financeapp
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    web:
      pageable:
        max-page-size: 100          # Giới hạn tối đa (nếu client truyền size > 100 thì Spring tự ép về 100)
        default-page-size: 20      # Kích thước mặc định khi client không truyền param size
        one-indexed-parameters: true # Trang bắt đầu từ 1 thay vì 0 (rất tiện, không cần tính toán thủ công)
  
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

google:
  web-client-id: ${GOOGLE_WEB_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 36000
  refresh-token-expiry-days: 30

rate-limit:
  max-request-email-forgot-password: 5
  reset-request-email-forgot-password: 1h

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:finance}
  max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:10485760}

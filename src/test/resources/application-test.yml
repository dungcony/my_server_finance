# Profile test: dùng cho Testcontainers / Integration Tests
# spring.datasource.* được @ServiceConnection tự override lúc chạy test.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/migration
    encoding: UTF-8
    baseline-on-migrate: false
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 50

logging:
  level:
    com.datn.financeapp: WARN

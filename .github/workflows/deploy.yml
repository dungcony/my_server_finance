name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # Hoặc master tùy theo nhánh chính của bạn

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Di chuyển vào thư mục chứa code trên EC2
            cd ~/my_server_finance

            # 2. Kéo code mới nhất từ GitHub
            git pull origin main

            # 3. Rebuild và khởi động lại chỉ riêng service backend (giữ nguyên DB và Redis)
            docker compose up -d --build finance-app

            # 4. Xóa các image rác cũ để tránh đầy ổ cứng
            docker image prune -f

info:
  name: 03. Cơ cấu theo nhóm lớn
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/reports/by-category-group"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: period
      value: "month"
      type: query
    - name: type
      value: "expense"
      type: query
    - name: wallet_id
      value: ""
      type: query

settings:
  encodeUrl: true

docs: Phân tích cơ cấu chi tiêu/thu nhập theo các nhóm nhu cầu lớn.

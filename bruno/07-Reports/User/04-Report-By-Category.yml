info:
  name: 04. Cơ cấu theo danh mục
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/reports/by-category"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: period
      value: "month"
      type: query
    - name: type
      value: "expense"
      type: query
    - name: level
      value: "parent"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: wallet_id
      value: ""
      type: query

settings:
  encodeUrl: true

docs: Phân tích chi tiết tỷ trọng theo từng danh mục cụ thể (Biểu đồ tròn).

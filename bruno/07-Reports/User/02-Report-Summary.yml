http:
  method: GET
  url: "{{baseUrl}}/reports/summary"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: period
      value: "month"
      type: query
    - name: from_date
      value: ""
      type: query
    - name: to_date
      value: ""
      type: query
    - name: wallet_id
      value: ""
      type: query

settings:
  encodeUrl: true

docs: Báo cáo tổng thu, tổng chi, tỷ lệ tiết kiệm theo khoảng thời gian.

info:
  name: 04. Xem báo cáo tổng hợp người dùng (Admin)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/reports/admin/summary"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
  params:
    - name: user_id
      value: "{{userId}}"
      type: query
    - name: period
      value: "month"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin: Xem báo cáo tóm tắt tình hình thu chi, số dư của bất kỳ người dùng nào trong hệ thống."

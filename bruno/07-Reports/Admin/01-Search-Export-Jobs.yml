info:
  name: 01. Tra cứu tiến trình xuất báo cáo (Admin)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/reports/admin/export-jobs"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: user_id
      value: ""
      type: query
    - name: status
      value: ""
      type: query
    - name: format
      value: ""
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin: Tra cứu danh sách tiến trình xuất file báo cáo toàn hệ thống có phân trang và bộ lọc."

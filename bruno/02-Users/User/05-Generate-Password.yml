info:
  name: 05. Tạo mật khẩu (tài khoản Google)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/users/me/password"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true

docs: Tài khoản đăng nhập Google chưa có mật khẩu — hệ thống sinh mật khẩu và gửi về email. Tài khoản đã có mật khẩu trả 409 PASSWORD_ALREADY_SET.

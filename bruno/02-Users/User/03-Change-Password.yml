info:
  name: 03. Đổi mật khẩu
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/users/me/password"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "old_password": "{{password}}",
        "new_password": "NewPassword123@"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Đổi mật khẩu người dùng đang đăng nhập.

info:
  name: 03. Đổi mật khẩu
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/users/me/password"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "old_password": "Password123@",
        "new_password": "NewPassword123@"
      }

settings:
  encodeUrl: true

docs: Đổi mật khẩu người dùng đang đăng nhập.

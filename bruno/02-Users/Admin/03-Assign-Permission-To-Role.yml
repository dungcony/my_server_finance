info:
  name: 03. Gán quyền hạn cho vai trò
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/admin/role/permission"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "role_name": "ROLE_ADMIN",
        "permission_name": "role_permission:read"
      }

settings:
  encodeUrl: true

docs: "Dành cho Admin: Gán thêm quyền hạn (permission) cho vai trò theo roleName."

info:
  name: khôi phục user
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/admin/user/undelete/{{userId}}"
  headers:
    - name: Authorization
      value: Bearer {{admin_access}}
    - name: Content-Type
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

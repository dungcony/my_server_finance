info:
  name: 02. Gán vai trò cho người dùng
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/admin/user/role"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "user_id": "{{userId}}",
        "role_name": "ROLE_ADMIN"
      }

settings:
  encodeUrl: true

docs: "Dành cho Admin: Gán thêm vai trò (role) cho người dùng."

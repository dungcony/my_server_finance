info:
  name: "11. Mở khóa người dùng"
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{baseUrl}}/admin/user/unlock"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "user_id": "{{userId}}"
      }

settings:
  encodeUrl: true

docs: "Dành cho Admin: Mở khóa tài khoản đang bị khóa (user_id trong body)."

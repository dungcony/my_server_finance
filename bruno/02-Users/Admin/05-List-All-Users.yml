info:
  name: 05. Lấy danh sách tất cả người dùng
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/admin/user/all"
  headers:
    - name: Authorization
      value: Bearer {{admin_access}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Dành cho Admin: Lấy danh sách toàn bộ người dùng trong hệ thống."

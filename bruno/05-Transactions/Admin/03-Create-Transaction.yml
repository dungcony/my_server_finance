info:
  name: "03. Tạo giao dịch cho người dùng"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/transactions/admin?user_id={{userId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "amount": 45000,
        "wallet_id": "{{walletId}}",
        "category_code": "{{categoryCode}}",
        "occurred_at": "2026-09-11T00:00:00Z",
        "display_name": "Cà phê sáng",
        "note": "Highlands Coffee"
      }

settings:
  encodeUrl: true

docs: "Dành cho Admin (TXN_UPDATE): Tạo giao dịch thay cho người dùng user_id (query)."

info:
  name: "01. Danh sách giao dịch toàn hệ thống"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/transactions/admin"
  headers:
    - name: Authorization
      value: "Bearer {{admin_access}}"
  params:
    - name: user_id
      value: ""
      type: query
    - name: is_deleted
      value: ""
      type: query
    - name: wallet_id
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: period
      value: "month"
      type: query
    - name: search
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin (TXN_READ): Danh sách giao dịch của mọi người dùng. Lọc theo user_id, is_deleted, ví, loại, thời gian, từ khoá."

info:
  name: 02. Giao dịch gom theo ngày
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/transactions/by-date"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: period
      value: "month"
      type: query
    - name: wallet_id
      value: ""
      type: query
    - name: type
      value: ""
      type: query

settings:
  encodeUrl: true

docs: Lấy giao dịch được nhóm theo từng ngày phục vụ màn hình Sổ giao dịch.

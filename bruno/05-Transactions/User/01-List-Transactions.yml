info:
  name: 01. Danh sách giao dịch
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/transactions"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: period
      value: "month"
      type: query
    - name: type
      value: ""
      type: query
    - name: wallet_id
      value: ""
      type: query
    - name: category_id
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: sort_by
      value: "date"
      type: query
    - name: sort_order
      value: "desc"
      type: query

settings:
  encodeUrl: true

docs: Lấy danh sách giao dịch có phân trang, bộ lọc thời gian, loại thu/chi/chuyển khoản, ví, danh mục.

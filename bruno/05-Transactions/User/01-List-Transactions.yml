info:
  name: 01. Danh sách giao dịch
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/transactions"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query
    - name: period
      value: month
      type: query
    - name: from
      value: ""
      type: query
    - name: to
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: wallet_id
      value: ""
      type: query
    - name: category_codes
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: min_amount
      value: ""
      type: query
    - name: max_amount
      value: ""
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lấy danh sách giao dịch có phân trang (page từ 1, page_size), lọc theo thời gian (period hoặc from/to dạng ISO-8601), loại (EXPENSE | INCOME | LOAN), ví, danh mục (category_codes), từ khoá và khoảng số tiền.

info:
  name: 06. Cập nhật giao dịch
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/transactions/{{transactionId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "amount": 55000,
        "wallet_id": "{{walletId}}",
        "category_code": "{{categoryCode}}",
        "occured_at": "2026-09-11T00:00:00Z",
        "display_name": "Cà phê sáng size L",
        "note": "Highlands Coffee kèm bánh ngọt"
      }

settings:
  encodeUrl: true

docs: Cập nhật một phần giao dịch (chỉ gửi trường cần đổi) và hoàn/trừ chênh lệch số dư ví tương ứng. Lưu ý trường thời gian của API này tên là occured_at (thiếu chữ r).

info:
  name: 04. Thêm giao dịch mới
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/transactions"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "amount": 4500000,
        "wallet_id": "{{walletId}}",
        "category_code": "an_trua",
        "occurred_at": "2026-09-11T00:00:00Z",
        "display_name": "Cà phê sáng",
        "note": "Highlands Coffee"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Tạo giao dịch thu/chi. Tự động cập nhật số dư ví và lưu transactionId.

info:
  name: 05. Thêm nhiều giao dịch (Bulk)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/transactions/bulk"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "transactions": [
          {
            "type": "expense",
            "amount": 35000,
            "wallet_id": "{{walletId}}",
            "category_id": "{{categoryId}}",
            "date": "2026-09-11",
            "display_name": "Bánh mì ăn sáng"
          },
          {
            "type": "expense",
            "amount": 40000,
            "wallet_id": "{{walletId}}",
            "category_id": "{{categoryId}}",
            "date": "2026-09-11",
            "display_name": "Trà đào trưa"
          }
        ]
      }

settings:
  encodeUrl: true

docs: Thêm hàng loạt giao dịch trong cùng 1 lần gọi API.

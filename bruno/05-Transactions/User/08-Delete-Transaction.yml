info:
  name: 08. Xóa giao dịch
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/transactions/{{transactionId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Xóa mềm giao dịch và hoàn lại số dư tương ứng cho ví.

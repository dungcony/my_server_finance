info:
  name: "01. Danh sách mục tiêu toàn hệ thống"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/goals/admin/all"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
  params:
    - name: userId
      value: ""
      type: query
    - name: status
      value: ""
      type: query
    - name: name
      value: ""
      type: query
    - name: targetDateFrom
      value: ""
      type: query
    - name: targetDateTo
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin (GOAL_READ): Danh sách mục tiêu của mọi người dùng. Lưu ý GoalFilterRequest bind theo camelCase: userId, status, name, targetDateFrom, targetDateTo."

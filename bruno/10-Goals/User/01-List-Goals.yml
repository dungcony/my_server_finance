info:
  name: 01. Danh sách mục tiêu tiết kiệm
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/goals"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: status
      value: in_progress
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lấy danh sách các mục tiêu tiết kiệm (đang thực hiện, hoàn thành, hủy).

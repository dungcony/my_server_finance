info:
  name: 01. Đăng nhập Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{admin}}",
        "password": "{{admin}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Đăng nhập bằng tài khoản Quản trị viên (Admin). Tự động lưu adminAccessToken và adminRefreshToken vào environment.

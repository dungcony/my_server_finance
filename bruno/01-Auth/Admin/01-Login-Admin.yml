info:
  name: 01. Đăng nhập Admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{admin}}",
        "password": "{{admin}}"
      }

runtime:
  postResponse: |-
    if (res.status === 200 && res.body && res.body.data && res.body.data.token) {
      bru.setEnvVar("admin_access", res.body.data.token.access);
      if (res.body.data.token.refresh) {
        bru.setEnvVar("admin_refresh", res.body.data.token.refresh);
      }
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Đăng nhập bằng tài khoản Quản trị viên (Admin). Tự động lưu admin_access và adminRefreshToken vào environment.

info:
  name: 03. Gửi lại mã OTP xác thực
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/resend-verification"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

settings:
  encodeUrl: true

docs: Yêu cầu gửi lại mã OTP kích hoạt tài khoản.

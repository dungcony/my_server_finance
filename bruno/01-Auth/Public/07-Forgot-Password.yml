info:
  name: 07. Quên mật khẩu
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }

settings:
  encodeUrl: true

docs: Gửi yêu cầu nhận mã OTP đặt lại mật khẩu.

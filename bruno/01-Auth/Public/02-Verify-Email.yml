info:
  name: 02. Xác thực email (OTP)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-email"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "code": "075650"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Xác thực tài khoản bằng mã OTP 6 chữ số gửi qua email. Tự động lưu accessToken và refreshToken.

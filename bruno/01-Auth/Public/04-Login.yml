info:
  name: 04. Đăng nhập
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "user",
        "password": "user"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Đăng nhập bằng email và mật khẩu. Tự động lưu accessToken và refreshToken vào environment.

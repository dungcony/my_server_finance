info:
  name: 08. Đặt lại mật khẩu
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "reset_code": "123456",
        "new_password": "NewPassword123@"
      }

settings:
  encodeUrl: true

docs: Đặt lại mật khẩu mới sử dụng mã OTP gửi qua email (lưu trên Redis).

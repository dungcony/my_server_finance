info:
  name: 07. Dự báo chi tiêu
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/ai/forecast"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: period
      value: "month"
      type: query

settings:
  encodeUrl: true

docs: AI dự báo xu hướng chi tiêu những ngày còn lại trong tháng dựa trên tốc độ hiện tại.

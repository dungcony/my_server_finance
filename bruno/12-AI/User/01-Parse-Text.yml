info:
  name: 01. Phân tích văn bản tiếng Việt
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/ai/parse-text"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "content": "hôm qua cà phê Highlands 45k\ntrưa nay cơm gà 60k\ngrab về nhà 35k",
        "default_wallet_id": "{{walletId}}"
      }

settings:
  encodeUrl: true

docs: Tách nhiều giao dịch từ câu nói hoặc tin nhắn tiếng Việt.

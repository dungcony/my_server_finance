info:
  name: 04. Duyệt bản nháp thành giao dịch
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/ai/drafts/{{draftId}}/approve"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "type": "expense",
        "amount": 45000,
        "wallet_id": "{{walletId}}",
        "category_id": "{{categoryId}}",
        "date": "2026-09-10",
        "display_name": "Cà phê Highlands"
      }

settings:
  encodeUrl: true

docs: Duyệt bản nháp AI và chính thức ghi sổ giao dịch.

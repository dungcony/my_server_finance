info:
  name: 05. Duyệt nhiều bản nháp cùng lúc
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/ai/drafts/approve-bulk"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "draft_ids": [
          "{{draftId}}"
        ]
      }

settings:
  encodeUrl: true

docs: Duyệt nhanh một loạt bản nháp AI mà không cần chỉnh sửa từng mục.

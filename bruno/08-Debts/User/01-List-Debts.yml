info:
  name: 01. Danh sách sổ nợ
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/debts"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: type
      value: ""
      type: query
    - name: status
      value: "outstanding"
      type: query
    - name: is_overdue
      value: ""
      type: query

settings:
  encodeUrl: true

docs: Lấy danh sách các khoản cho vay và đi vay (lọc theo trạng thái còn nợ/đã trả xong/quá hạn).

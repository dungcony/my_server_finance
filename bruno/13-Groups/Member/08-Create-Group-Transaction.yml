info:
  name: 08. Tạo giao dịch nhóm
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/groups/{{groupId}}/transactions"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "type": "EXPENSE",
        "money_source": "FUND",
        "amount": 250000,
        "occurred_at": "2026-03-20T12:00:00Z",
        "category_code": "{{categoryCode}}",
        "transactor_id": "{{userId}}",
        "note": "Ăn tối hải sản",
        "participants": [
          {
            "user_id": "{{userId}}",
            "share_amount": 250000
          }
        ]
      }

settings:
  encodeUrl: true

docs: "Ghi giao dịch nhóm. type: EXPENSE | CONTRIBUTION | REFUND | ADJUSTMENT_UP | ADJUSTMENT_DOWN. money_source: FUND | PERSONAL. Khoản ghi bởi thành viên thường sẽ ở trạng thái PENDING chờ duyệt."

info:
  name: 11. Cập nhật giao dịch nhóm
  type: http
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/groups/{{groupId}}/transactions/{{groupTxnId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "txn_id": "{{groupTxnId}}",
        "amount": 300000,
        "type": "EXPENSE",
        "money_source": "FUND",
        "occurred_at": "2026-03-20T12:00:00Z",
        "category_code": "{{categoryCode}}",
        "transactor_id": "{{userId}}",
        "note": "Ăn tối hải sản (đã chỉnh sửa)",
        "participants": [
          {
            "user_id": "{{userId}}",
            "share_amount": 300000
          }
        ]
      }

settings:
  encodeUrl: true

docs: Người ghi hoặc Chủ nhóm sửa giao dịch. Có thể gửi thêm status (PENDING | CONFIRMED | REJECTED). Nếu thành viên thường sửa khoản đã duyệt, khoản sẽ quay lại PENDING.

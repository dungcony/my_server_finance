info:
  name: 12. Tổng quan tài chính nhóm
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/groups/{{groupId}}/summary"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: month
      value: "2026-03"
      type: query

settings:
  encodeUrl: true

docs: Xem tổng quan tài chính nhóm, tổng số dư quỹ và chi tiêu trong kỳ.

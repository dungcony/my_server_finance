info:
  name: 03. Tạo nhóm mới
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/groups"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "name": "Chuyến đi Đà Nẵng",
        "description": "Quỹ ăn chơi hè 2026",
        "target": 15000000,
        "is_settlement_enabled": true,
        "is_join_without_confirm": true,
        "members": []
      }

settings:
  encodeUrl: true

docs: Tạo nhóm mới. Người tạo mặc định là Chủ nhóm (OWNER) và đồng thời là người giữ quỹ ban đầu.

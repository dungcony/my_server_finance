info:
  name: 04. Tham gia nhóm bằng mã mời
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/groups/join"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: code
      value: ABC12345
      type: query

settings:
  encodeUrl: true

docs: Tham gia nhóm bằng mã mời (query code) do chủ nhóm cung cấp. Nếu nhóm bật duyệt, trạng thái sẽ là PENDING.

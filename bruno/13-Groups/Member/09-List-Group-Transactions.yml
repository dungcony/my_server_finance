  url: "{{baseUrl}}/groups/{{groupId}}/transactions"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: money_source
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: status
      value: ""
      type: query
    - name: user_id
      value: ""
      type: query
    - name: start_date
      value: ""
      type: query
    - name: end_date
      value: ""
      type: query
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: Xem lịch sử giao dịch nhóm, hỗ trợ phân trang và lọc theo nguồn tiền, loại giao dịch, trạng thái.

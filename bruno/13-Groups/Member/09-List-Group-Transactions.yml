info:
  name: 09. Lịch sử giao dịch nhóm
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/groups/{{groupId}}/transactions"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: money_source
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: transactor_id
      value: ""
      type: query
    - name: create_id
      value: ""
      type: query
    - name: from_occurred_at
      value: ""
      type: query
    - name: to_occurred_at
      value: ""
      type: query
    - name: start_date
      value: ""
      type: query
    - name: end_date
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: Xem lịch sử giao dịch nhóm, phân trang (page từ 1, page_size) và lọc theo nguồn tiền, loại giao dịch, người giao dịch, người tạo, khoảng thời gian.

info:
  name: 18. Sửa khoản trả lại tiền
  type: http
  seq: 18

http:
  method: PUT
  url: "{{baseUrl}}/groups/{{groupId}}/refunds/{{groupTxnId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "to_user_id": "{{memberUserId}}",
        "amount": 120000,
        "note": "Sửa khoản quỹ hoàn trả tiền"
      }

settings:
  encodeUrl: true

docs: "Dành cho Thủ quỹ / Owner: Chỉnh sửa thông tin khoản hoàn trả tiền từ quỹ."

info:
  name: 17. Quỹ trả lại tiền cho thành viên
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/groups/{{groupId}}/refunds"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "to_user_id": "{{memberUserId}}",
        "amount": 100000,
        "note": "Quỹ hoàn trả tiền đã chi trước"
      }

settings:
  encodeUrl: true

docs: "Dành cho Thủ quỹ / Owner: Trích tiền quỹ trả lại cho thành viên đã chi trả bằng tiền túi cá nhân."

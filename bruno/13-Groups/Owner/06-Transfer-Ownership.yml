info:
  name: 06. Chuyển quyền chủ nhóm
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/groups/{{groupId}}/owner-role/{{newOwnerId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true

docs: "Dành cho Chủ nhóm (OWNER): Chuyển nhượng vai trò chủ nhóm cho một thành viên ACTIVE khác (newOwnerId trên URL)."

info:
  name: 15. Từ chối hàng loạt giao dịch
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/groups/{{groupId}}/transactions/statuses"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "txn_ids": [
          "{{groupTxnId}}"
        ],
        "status": "REJECTED"
      }

settings:
  encodeUrl: true

docs: "Dành cho Thủ quỹ / Owner: Từ chối cùng lúc nhiều khoản giao dịch PENDING (status = REJECTED)."

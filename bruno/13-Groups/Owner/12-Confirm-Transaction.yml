info:
  name: 12. Xác nhận giao dịch
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/groups/{{groupId}}/transactions/status"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "txn_id": "{{groupTxnId}}",
        "status": "CONFIRMED",
        "reason": ""
      }

settings:
  encodeUrl: true

docs: "Dành cho Thủ quỹ / Owner: Duyệt khoản chi tiêu hoặc nộp quỹ đang ở trạng thái PENDING."

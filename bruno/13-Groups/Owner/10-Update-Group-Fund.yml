info:
  name: 10. Bàn giao thủ quỹ
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/groups/{{groupId}}/fund-kepper"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "keepper_id": "{{memberUserId}}"
      }

settings:
  encodeUrl: true

docs: "Dành cho Chủ nhóm (OWNER): Bàn giao quyền giữ quỹ (thủ quỹ) sang một thành viên khác trong nhóm."

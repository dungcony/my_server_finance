  url: "{{baseUrl}}/wallets/admin/all"
  headers:
    - name: Authorization
      value: "Bearer {{admin_access}}"
  params:
    - name: user_id
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: is_deleted
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin: Danh sách ví của mọi người dùng. Lọc theo user_id, từ khoá, loại ví, trạng thái xóa."

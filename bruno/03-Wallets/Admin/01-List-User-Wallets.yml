info:
  name: "01. Danh sách ví của một người dùng"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/wallets/admin/{{userId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminAccessToken}}"
  params:
    - name: search
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: is_deleted
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin: Danh sách ví của người dùng có id trên URL. is_deleted để lọc ví đã xóa mềm."

info:
  name: 10. Đối chiếu số dư ví
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/wallets/{{walletId}}/reconcile"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: auto_fix
      value: "false"
      type: query

settings:
  encodeUrl: true

docs: Đối chiếu số dư lưu trữ với tổng giao dịch trong lịch sử để phát hiện lệch số liệu.

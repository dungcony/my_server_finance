info:
  name: 07. Sắp xếp thứ tự ví
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{baseUrl}}/wallets/reorder"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "sort_order": [
          "{{walletId}}"
        ]
      }

settings:
  encodeUrl: true

docs: Cập nhật thứ tự sắp xếp các ví trên giao diện.

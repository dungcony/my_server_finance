info:
  name: 02. Tổng quan số dư ví
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/wallets/summary"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

settings:
  encodeUrl: true

docs: Lấy tổng tài sản, tổng số dư tính vào báo cáo và tóm tắt theo từng loại ví.

info:
  name: 09. Điều chỉnh số dư ví
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/wallets/{{walletId}}/adjust-balance"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "actual_balance": 1000000,
        "counts_in_report": true,
        "note": "Điều chỉnh số dư cho khớp với tiền trong ví thực tế"
      }

settings:
  encodeUrl: true

docs: Điều chỉnh số dư ví khớp với thực tế. Tự động sinh giao dịch bù trừ chênh lệch.

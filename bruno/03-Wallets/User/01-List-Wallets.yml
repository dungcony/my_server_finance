info:
  name: 01. Danh sách ví
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/wallets"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: search
      value: ""
      type: query
    - name: type
      value: ""
      type: query
    - name: is_default
      value: ""
      type: query
    - name: min_balance
      value: ""
      type: query
    - name: max_balance
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lấy danh sách ví của người dùng hiện tại, phân trang (page từ 1, page_size). Lọc theo từ khoá, loại ví, ví mặc định, khoảng số dư.

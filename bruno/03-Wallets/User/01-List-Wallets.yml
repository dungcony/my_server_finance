info:
  name: 01. Danh sách ví
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/wallets"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: type
      value: ""
      type: query
    - name: only_in_total
      value: ""
      type: query
    - name: include_shared
      value: "true"
      type: query

settings:
  encodeUrl: true

docs: Lấy danh sách các ví tiền của người dùng hiện tại (cá nhân và ví chung).

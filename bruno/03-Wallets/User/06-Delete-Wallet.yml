http:
  method: DELETE
  url: "{{baseUrl}}/wallets/{{walletId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: delete_transactions
      value: "false"
      type: query

settings:
  encodeUrl: true

docs: Xóa mềm ví tiền. delete_transactions=false giữ lại lịch sử giao dịch.

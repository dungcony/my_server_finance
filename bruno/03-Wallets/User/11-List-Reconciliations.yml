info:
  name: "11. Lịch sử đối soát ví"
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/wallets/{{walletId}}/reconciliations"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Lịch sử đối soát số dư của một ví thuộc người dùng hiện tại, phân trang (page từ 1, page_size)."

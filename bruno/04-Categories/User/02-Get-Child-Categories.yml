info:
  name: 02. Danh sách danh mục con
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories/{{categoryCode}}/children"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"

runtime:
  postResponse: |-
    if (res.status === 200 && res.body && res.body.data && res.body.data.length > 0) {
      bru.setEnvVar("childCategoryCode", res.body.data[0].code);
    }

settings:
  encodeUrl: true

docs: Lấy danh sách các danh mục con trực tiếp theo mã danh mục cha (`categoryCode`). Mọi người dùng đã xác thực đều có thể truy cập.

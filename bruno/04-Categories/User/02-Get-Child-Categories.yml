info:
  name: 02. Danh sách danh mục con
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/categories/{{categoryCode}}/children"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lấy danh sách các danh mục con trực tiếp theo mã danh mục cha (`categoryCode`). Mọi người dùng đã xác thực đều có thể truy cập.

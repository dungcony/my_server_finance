info:
  name: 10. Bật tắt danh mục trong ví
  type: http
  seq: 10

http:
  method: PATCH
  url: "{{baseUrl}}/wallets/{{walletId}}/categories/{{categoryId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "is_enabled": true
      }

settings:
  encodeUrl: true

docs: Bật hoặc tắt trạng thái sử dụng của một danh mục trong ví cụ thể.

info:
  name: 01. Danh sách danh mục gốc
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/categories"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lấy danh sách các danh mục gốc (không có danh mục cha). Mọi người dùng đã xác thực đều có thể truy cập. Tự động lưu mã danh mục đầu tiên vào biến `categoryCode`.

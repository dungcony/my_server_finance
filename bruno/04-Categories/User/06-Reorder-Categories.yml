info:
  name: 06. Sắp xếp danh mục
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/categories/reorder"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "parent_category_id": null,
        "sort_order": [
          "{{categoryId}}"
        ]
      }

settings:
  encodeUrl: true

docs: Cập nhật thứ tự hiển thị danh mục.

info:
  name: 03. Xóa danh mục
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/categories/{{tempCategoryCode}}"
  headers:
    - name: Authorization
      value: "Bearer {{admin_access}}"

settings:
  encodeUrl: true

docs: "Dành cho Admin (yêu cầu quyền `categories:delete`): Xóa mềm danh mục và toàn bộ các danh mục con hậu duệ theo mã danh mục `categoryCode`."

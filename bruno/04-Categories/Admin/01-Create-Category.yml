info:
  name: 01. Tạo danh mục
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/categories"
  headers:
    - name: Authorization
      value: "Bearer {{admin_access}}"
    - name: Content-Type
      value: "application/json"
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "name": "Danh mục test",
        "code": "test_cat",
        "description": "Dùng cho kiểm thử tự động",
        "icon_code": "ca_phe",
        "color": "#3D6B7D",
        "parent_code": null
      }

runtime:
  postResponse: |-
    if (res.status === 201 && res.body && res.body.data && res.body.data.code) {
      bru.setVar("tempCategoryCode", res.body.data.code);
      bru.setEnvVar("tempCategoryCode", res.body.data.code);
    } else if (res.status === 409) {
      bru.setVar("tempCategoryCode", "test_cat");
      bru.setEnvVar("tempCategoryCode", "test_cat");
    }

settings:
  encodeUrl: true

docs: "Dành cho Admin (yêu cầu quyền `categories:update`): Tạo danh mục mới trong hệ thống. Hỗ trợ header `Idempotency-Key`. Để tạo danh mục gốc (master category), đặt `parent_code` là null."

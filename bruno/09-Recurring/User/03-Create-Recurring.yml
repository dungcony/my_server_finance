info:
  name: 03. Tạo giao dịch định kỳ
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/recurring"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "display_name": "Tiền thuê nhà",
        "type": "expense",
        "amount": 3500000,
        "wallet_id": "{{walletId}}",
        "category_id": "{{categoryId}}",
        "frequency": "month",
        "interval": 1,
        "start_date": "2026-09-01",
        "end_date": null,
        "note": "Thanh toán đầu tháng"
      }

runtime:
  postResponse: |-
    if (res.status === 201 && res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar("recurringId", res.body.data.id);
    }

settings:
  encodeUrl: true

docs: Tạo lịch lặp lại định kỳ theo ngày/tuần/tháng/năm. Tự lưu recurringId.

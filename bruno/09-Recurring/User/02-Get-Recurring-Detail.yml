info:
  name: 02. Chi tiết giao dịch định kỳ
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/recurring/{{recurringId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Xem chi tiết một lịch định kỳ theo ID.

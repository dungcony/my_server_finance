info:
  name: 01. Danh sách giao dịch định kỳ
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/recurring"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: type
      value: ""
      type: query
    - name: frequency
      value: ""
      type: query
    - name: wallet_id
      value: ""
      type: query
    - name: category_code
      value: ""
      type: query
    - name: is_enabled
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: min_amount
      value: ""
      type: query
    - name: max_amount
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Danh sách giao dịch định kỳ của người dùng hiện tại, phân trang (page từ 1, page_size). type: EXPENSE | INCOME | LOAN, frequency: DAY | WEEK | MONTH | QUARTER | YEAR."

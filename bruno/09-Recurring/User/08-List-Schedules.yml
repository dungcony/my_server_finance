info:
  name: 08. Danh sách buổi lịch
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/recurring/{{recId}}/schedules?page=1&page_size=20"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Danh sách các buổi lịch phát sinh của một lịch định kỳ (mặc định sắp theo run_date tăng dần).

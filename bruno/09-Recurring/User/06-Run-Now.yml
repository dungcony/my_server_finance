http:
  method: POST
  url: "{{baseUrl}}/recurring/{{recurringId}}/run-now"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Idempotency-Key
      value: ""

settings:
  encodeUrl: true

docs: Kích hoạt tạo giao dịch ngay tại thời điểm hiện tại không đợi tới kỳ hạn.

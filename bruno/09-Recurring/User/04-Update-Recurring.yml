info:
  name: 04. Cập nhật lịch định kỳ
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/recurring/{{recurringId}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "display_name": "Tiền thuê nhà & điện nước",
        "amount": 3800000,
        "wallet_id": "{{walletId}}",
        "category_id": "{{categoryId}}",
        "end_date": null,
        "note": "Tăng thêm tiền nước"
      }

settings:
  encodeUrl: true

docs: Sửa số tiền, ví, danh mục hoặc ngày kết thúc của lịch định kỳ.

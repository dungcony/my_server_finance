info:
  name: 03. Nhật ký webhook payOS
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/payments/admin/webhook-logs"
  headers:
    - name: Authorization
      value: Bearer {{admin_access}}
  params:
    - name: only_failed
      value: "true"
      type: query
    - name: result
      value: INVALID_SIGNATURE
      type: query
      disabled: true
    - name: order_code
      value: "{{orderCode}}"
      type: query
      disabled: true
    - name: from_date
      value: "2026-01-01"
      type: query
      disabled: true
    - name: to_date
      value: "2026-12-31"
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Dành cho Admin (quyền PAYMENT_READ hoặc ROLE_ADMIN): mỗi lần payOS gọi webhook đều có một dòng.
  only_failed=true chỉ lấy nhóm lỗi (INVALID_BODY, INVALID_SIGNATURE, ORDER_NOT_FOUND, LINK_MISMATCH, ORDER_CLOSED, UNDERPAID, ERROR).
  Có thể xem bằng trang web: /v1/ui/admin/webhooks.html.

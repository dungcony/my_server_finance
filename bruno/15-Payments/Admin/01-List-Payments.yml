info:
  name: 01. Danh sách thanh toán toàn hệ thống
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/payments/admin"
  headers:
    - name: Authorization
      value: Bearer {{admin_access}}
  params:
    - name: user_id
      value: "{{userId}}"
      type: query
      disabled: true
    - name: status
      value: PAID
      type: query
      disabled: true
    - name: type
      value: PREMIUM_UPGRADE
      type: query
      disabled: true
    - name: from_date
      value: 2026-01-01
      type: query
      disabled: true
    - name: to_date
      value: 2026-12-31
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Dành cho Admin (quyền PAYMENT_READ hoặc ROLE_ADMIN): xem thanh toán của mọi user, chỉ đọc. from_date/to_date dạng yyyy-MM-dd, to_date tính cả ngày đó."

info:
  name: 04. Thống kê webhook payOS
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/payments/admin/webhook-logs/summary"
  headers:
    - name: Authorization
      value: Bearer {{admin_access}}
  params:
    - name: hours
      value: "24"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Dành cho Admin: tổng số webhook, số lỗi, tỉ lệ lỗi, đếm theo từng loại kết quả, lần thành công/lỗi gần nhất.
  paid_without_webhook liệt kê order_code các đơn đã PAID quá PAYMENT_WEBHOOK_MISSING_MINUTES phút mà không có webhook xác nhận (webhook có thể không tới).

info:
  name: 02. Chi tiết một đơn thanh toán
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/payments/admin/{{orderCode}}"
  headers:
    - name: Authorization
      value: Bearer {{adminAccessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Dành cho Admin (quyền PAYMENT_READ hoặc ROLE_ADMIN): xem đơn của bất kỳ user nào, kèm user_id, payos_link_id, amount_paid và excess_amount (phần trả dư, dùng đối chiếu khiếu nại)."

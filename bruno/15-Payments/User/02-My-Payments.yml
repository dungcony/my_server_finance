info:
  name: 02. Lịch sử thanh toán của tôi
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/payments"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: status
      value: PAID
      type: query
      disabled: true
    - name: type
      value: PREMIUM_UPGRADE
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lịch sử thanh toán của chính user, mới nhất trước. Lọc theo status (PENDING/PAID/CANCELLED/EXPIRED) và type. Mỗi dòng có amount_paid và excess_amount (phần trả dư).

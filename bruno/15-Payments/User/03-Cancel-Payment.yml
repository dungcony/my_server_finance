info:
  name: 03. Huỷ đơn thanh toán
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/payments/{{orderCode}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  User chủ động huỷ đơn thanh toán PENDING của chính mình.
  Endpoint có tính idempotent:
  - Nếu đơn PENDING: huỷ link payOS và chuyển trạng thái thành CANCELLED.
  - Nếu đơn đã kết thúc (PAID / CANCELLED / EXPIRED): trả về trạng thái hiện tại của đơn, không báo lỗi.
  - Đơn không tồn tại hoặc của user khác -> 404 NOT_FOUND.

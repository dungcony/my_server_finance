info:
  name: "01. Danh sách ngân sách toàn hệ thống"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/budgets/admin"
  headers:
    - name: Authorization
      value: "Bearer {{admin_access}}"
  params:
    - name: user_id
      value: ""
      type: query
    - name: is_deleted
      value: ""
      type: query
    - name: is_active
      value: ""
      type: query
    - name: period
      value: ""
      type: query
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "20"
      type: query

settings:
  encodeUrl: true

docs: "Dành cho Admin (BUDGET_READ): Danh sách ngân sách của mọi người dùng. period: week | month | quarter | year."

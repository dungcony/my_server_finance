info:
  name: 03. Gợi ý hạn mức ngân sách
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/budgets/suggestion"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: category_id
      value: "{{categoryId}}"
      type: query

settings:
  encodeUrl: true

docs: Dựa trên chi tiêu lịch sử để tính toán gợi ý hạn mức ngân sách hợp lý cho danh mục.

info:
  name: 06. Tạo ngân sách mới
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/budgets"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
    - name: Idempotency-Key
      value: ""
  body:
    type: json
    data: |-
      {
        "category_code": "{{category}}",
        "limit_amount": 2000000,
        "period_type": "month",
        "start_date": "2026-09-01",
        "auto_renew": true
      }

runtime:
  postResponse: |-
    if ((res.status === 201 || res.status === 200) && res.body && res.body.data && res.body.data.id) {
      bru.setEnvVar("budgetId", res.body.data.id);
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Thiết lập hạn mức chi tiêu cho danh mục theo tuần/tháng/quý/năm.

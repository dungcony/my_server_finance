info:
  name: 01. Danh sách ngân sách
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/budgets"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: is_active
      value: "true"
      type: query
    - name: period
      value: "month"
      type: query

settings:
  encodeUrl: true

docs: Lấy danh sách các hạn mức ngân sách đang theo dõi.
